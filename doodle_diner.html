<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Diner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Prevent zooming/scrolling on mobile */
        }
        .title-font {
            font-family: 'Chewy', cursive;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #fff8f0; /* Light diner counter color */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        
        /* Delicious Splash Screen Gradient */
        .bg-delicious {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 20%, #fccb90 40%, #ffc3a0 60%, #ffafbd 80%, #ffc3a0 100%);
            background-size: 300% 300%;
            animation: gradientAnim 10s ease infinite;
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-tasty {
            background: linear-gradient(to bottom, #ff512f, #dd2476);
            box-shadow: 0 6px 0 #900c3f, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .btn-tasty:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #900c3f, 0 5px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Splash Screen -->
    <div id="splash-screen" class="overlay bg-delicious text-center p-4">
        <h1 class="title-font text-7xl md:text-9xl text-white drop-shadow-lg mb-4" style="-webkit-text-stroke: 3px #c70039;">Doodle Diner</h1>
        <p class="text-xl md:text-2xl text-gray-800 font-bold mb-8 bg-white/50 px-6 py-2 rounded-full shadow-sm"></p>
        <button id="start-btn" class="btn-tasty text-white title-font text-4xl px-12 py-4 rounded-full border-4 border-white cursor-pointer hover:scale-105">
            Play Now!
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay bg-black/80 text-center p-4 hidden">
        <h1 class="title-font text-7xl text-yellow-400 drop-shadow-md mb-2">Shift Over!</h1>
        <p class="text-3xl text-white mb-6">Final Score: <span id="final-score" class="font-bold text-green-400">0</span></p>
        <button id="restart-btn" class="btn-tasty text-white title-font text-3xl px-10 py-3 rounded-full border-4 border-white cursor-pointer hover:scale-105">
            Play Again
        </button>
    </div>

    <!-- The Game Canvas -->
    <canvas id="gameCanvas"></canvas>
</div>

<!-- Subtle Footer -->
<div class="fixed bottom-2 left-0 w-full text-center text-[9px] text-[#333] pointer-events-none z-50 tracking-wider">
    Created by Meglen
</div>

<script>

    // ==========================================
    // --- MODULE: Config & Constants ---
    // ==========================================
    const CONFIG = {
        GAME_DURATION: 60, // seconds
        CANVAS_WIDTH: 800,
        CANVAS_HEIGHT: 1000,
        COLORS: {
            bg: '#fff8f0',
            counter: '#e0d5c1',
            text: '#333'
        }
    };

    const INGREDIENT_TYPES = {
        BUN_BOTTOM: { id: 'BUN_BOTTOM', name: 'Bottom Bun', color: '#e6a861', shape: 'half-circle-down', imgSrc: null },
        PATTY:      { id: 'PATTY',      name: 'Meat Patty', color: '#6e3c15', shape: 'round-rect',       imgSrc: null },
        CHEESE:     { id: 'CHEESE',     name: 'Cheese',     color: '#ffcc00', shape: 'rect',             imgSrc: null },
        LETTUCE:    { id: 'LETTUCE',    name: 'Lettuce',    color: '#4caf50', shape: 'triangle-jagged',  imgSrc: null },
        TOMATO:     { id: 'TOMATO',     name: 'Tomato',     color: '#f44336', shape: 'circle',           imgSrc: null },
        BUN_TOP:    { id: 'BUN_TOP',    name: 'Top Bun',    color: '#e6a861', shape: 'half-circle-up',   imgSrc: null }
    };
    const AVAILABLE_INGREDIENTS = Object.keys(INGREDIENT_TYPES);

    // ==========================================
    // --- MODULE: Graphics Engine ---
    // ==========================================
    class GraphicsEngine {
        // This is the core method for future-proofing your art.
        static drawIngredient(ctx, typeKey, x, y, width, height) {
            const type = INGREDIENT_TYPES[typeKey];
            
            // 1. IF CUSTOM ART EXISTS, DRAW IMAGE
            if (type.imgSrc && type.imgObj) {
                ctx.drawImage(type.imgObj, x - width/2, y - height/2, width, height);
                return;
            }

            // 2. ELSE, DRAW PLACEHOLDER SHAPE
            ctx.fillStyle = type.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.save();
            ctx.translate(x, y);

            ctx.beginPath();
            switch (type.shape) {
                case 'circle':
                    ctx.arc(0, 0, width/2, 0, Math.PI * 2);
                    break;
                case 'rect':
                    ctx.rect(-width/2, -height/2, width, height);
                    break;
                case 'round-rect':
                    ctx.roundRect(-width/2, -height/2, width, height, 10);
                    break;
                case 'half-circle-up':
                    ctx.arc(0, height/4, width/2, Math.PI, 0);
                    ctx.lineTo(width/2, height/4);
                    break;
                case 'half-circle-down':
                    ctx.arc(0, -height/4, width/2, 0, Math.PI);
                    ctx.lineTo(-width/2, -height/4);
                    break;
                case 'triangle-jagged':
                    // Abstract lettuce shape
                    ctx.moveTo(-width/2, height/2);
                    ctx.lineTo(-width/4, -height/2);
                    ctx.lineTo(0, height/3);
                    ctx.lineTo(width/4, -height/2);
                    ctx.lineTo(width/2, height/2);
                    ctx.closePath();
                    break;
                default:
                    ctx.rect(-width/2, -height/2, width, height);
            }
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // Helper for rounded rectangles if not supported by older browsers
        static ensureRoundRect(ctx) {
            if (!ctx.roundRect) {
                ctx.roundRect = function (x, y, w, h, r) {
                    if (w < 2 * r) r = w / 2;
                    if (h < 2 * r) r = h / 2;
                    this.beginPath();
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    this.closePath();
                    return this;
                }
            }
        }
    }

    // ==========================================
    // --- MODULE: Order (Tickets) ---
    // ==========================================
    class Order {
        constructor(difficulty) {
            this.ingredients = [];
            // Generate a random stack based on difficulty
            const numItems = Math.min(3 + Math.floor(difficulty / 5), 6); // Max 6 items
            
            this.ingredients.push('BUN_BOTTOM'); // Always start with bun
            for (let i = 0; i < numItems - 2; i++) {
                const randomMiddle = AVAILABLE_INGREDIENTS[Math.floor(Math.random() * (AVAILABLE_INGREDIENTS.length - 2)) + 1];
                this.ingredients.push(randomMiddle);
            }
            this.ingredients.push('BUN_TOP'); // Always end with bun
            
            this.x = CONFIG.CANVAS_WIDTH / 2;
            this.y = 120;
            this.width = 180;
            this.height = 180;
            // progress is dynamically calculated now based on plate content
        }

        draw(ctx, plateStack = []) {
            // Draw Ticket Background
            ctx.fillStyle = '#fff';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
            ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
            ctx.shadowColor = 'transparent'; // reset

            // Ticket pin
            ctx.fillStyle = '#999';
            ctx.beginPath();
            ctx.arc(this.x, this.y - this.height/2 + 10, 5, 0, Math.PI*2);
            ctx.fill();

            // Calculate progress for visual dimming
            let matchCount = 0;
            for (let i = 0; i < plateStack.length; i++) {
                if (plateStack[i] === this.ingredients[i]) matchCount++;
                else break;
            }

            // Draw Order Ingredients mini-preview
            const startY = this.y + this.height/2 - 20;
            const stepY = (this.height - 40) / this.ingredients.length;
            
            for (let i = 0; i < this.ingredients.length; i++) {
                const ingKey = this.ingredients[i];
                const drawY = startY - (i * stepY);
                
                // Dim items that have correctly been placed in sequence
                ctx.globalAlpha = i < matchCount ? 0.3 : 1.0;
                GraphicsEngine.drawIngredient(ctx, ingKey, this.x, drawY, 60, 20);
                ctx.globalAlpha = 1.0;
            }
        }
    }

    // ==========================================
    // --- MODULE: Stations & Plate ---
    // ==========================================
    class CanvasButton {
        constructor(text, x, y, width, height, color, hoverColor) {
            this.text = text;
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
            this.color = color;
            this.hoverColor = hoverColor;
            this.isPressed = false;
        }

        draw(ctx) {
            ctx.fillStyle = this.isPressed ? this.hoverColor : this.color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px "Nunito", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.text, this.x, this.y + 2);
        }

        contains(px, py) {
            return px >= this.x - this.width/2 && px <= this.x + this.width/2 &&
                   py >= this.y - this.height/2 && py <= this.y + this.height/2;
        }
    }

    class Station {
        constructor(typeKey, x, y, size) {
            this.typeKey = typeKey;
            this.x = x;
            this.y = y;
            this.size = size;
            this.isPressed = false;
        }

        draw(ctx) {
            // Station base/button
            ctx.fillStyle = this.isPressed ? '#d0c5b1' : '#e0d5c1';
            ctx.strokeStyle = '#8a7d69';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size, 15);
            ctx.fill();
            ctx.stroke();

            // Draw the ingredient representation on the button
            const offset = this.isPressed ? 5 : 0;
            GraphicsEngine.drawIngredient(ctx, this.typeKey, this.x, this.y + offset, this.size * 0.6, this.size * 0.6);
        }

        contains(px, py) {
            return px >= this.x - this.size/2 && px <= this.x + this.size/2 &&
                   py >= this.y - this.size/2 && py <= this.y + this.size/2;
        }
    }

    // ==========================================
    // --- MODULE: Game Engine ---
    // ==========================================
    class Game {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            GraphicsEngine.ensureRoundRect(this.ctx);

            this.resizeCanvas();
            window.addEventListener('resize', () => this.resizeCanvas());

            // Game State
            this.state = 'SPLASH'; // SPLASH, PLAYING, GAMEOVER
            this.score = 0;
            this.timeLeft = CONFIG.GAME_DURATION;
            this.lastTime = 0;
            
            // Entities
            this.stations = [];
            this.currentOrder = null;
            this.plateStack = [];
            this.particles = [];
            this.floatingTexts = [];
            
            // Canvas UI Buttons
            const plateY = CONFIG.CANVAS_HEIGHT - 350;
            this.submitBtn = new CanvasButton('Submit', CONFIG.CANVAS_WIDTH/2 + 150, plateY + 120, 120, 50, '#4ade80', '#22c55e');
            this.trashBtn = new CanvasButton('Trash', CONFIG.CANVAS_WIDTH/2 - 150, plateY + 120, 120, 50, '#ef4444', '#dc2626');

            this.setupStations();
            this.setupInputs();

            // Bind UI
            document.getElementById('start-btn').addEventListener('click', () => this.start());
            document.getElementById('restart-btn').addEventListener('click', () => this.start());

            // Start Render Loop
            requestAnimationFrame((time) => this.loop(time));
        }

        resizeCanvas() {
            // Calculate a scale to fit the logical size into the window while maintaining aspect ratio
            const windowRatio = window.innerWidth / window.innerHeight;
            const logicalRatio = CONFIG.CANVAS_WIDTH / CONFIG.CANVAS_HEIGHT;

            let actualWidth, actualHeight;

            if (windowRatio < logicalRatio) {
                actualWidth = window.innerWidth;
                actualHeight = window.innerWidth / logicalRatio;
            } else {
                actualHeight = window.innerHeight;
                actualWidth = window.innerHeight * logicalRatio;
            }

            // High DPI screen support
            const dpr = window.devicePixelRatio || 1;
            this.canvas.width = CONFIG.CANVAS_WIDTH; // Internal resolution
            this.canvas.height = CONFIG.CANVAS_HEIGHT;
            
            // CSS size controls layout
            this.canvas.style.width = `${actualWidth}px`;
            this.canvas.style.height = `${actualHeight}px`;

            // Calculate interaction scale
            this.scaleX = CONFIG.CANVAS_WIDTH / actualWidth;
            this.scaleY = CONFIG.CANVAS_HEIGHT / actualHeight;
        }

        setupStations() {
            const numStations = AVAILABLE_INGREDIENTS.length;
            const stationSize = 100;
            const padding = 20;
            const totalWidth = (numStations * stationSize) + ((numStations - 1) * padding);
            let startX = (CONFIG.CANVAS_WIDTH - totalWidth) / 2 + (stationSize/2);
            const y = CONFIG.CANVAS_HEIGHT - 120;

            this.stations = AVAILABLE_INGREDIENTS.map((type, index) => {
                const x = startX + (index * (stationSize + padding));
                return new Station(type, x, y, stationSize);
            });
        }

        setupInputs() {
            // Handle both touch and mouse clicks via pointerdown
            this.canvas.addEventListener('pointerdown', (e) => {
                if (this.state !== 'PLAYING') return;

                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * this.scaleX;
                const y = (e.clientY - rect.top) * this.scaleY;

                this.handleInput(x, y);
            });
            
            this.canvas.addEventListener('pointerup', () => {
                this.stations.forEach(s => s.isPressed = false);
                this.submitBtn.isPressed = false;
                this.trashBtn.isPressed = false;
            });
        }

        start() {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            this.score = 0;
            this.timeLeft = CONFIG.GAME_DURATION;
            this.plateStack = [];
            this.floatingTexts = [];
            this.currentOrder = new Order(this.score);
            this.state = 'PLAYING';
            this.lastTime = performance.now();
        }

        endGame() {
            this.state = 'GAMEOVER';
            document.getElementById('final-score').innerText = this.score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        handleInput(x, y) {
            // Check station clicks
            const clickedStation = this.stations.find(s => s.contains(x, y));
            if (clickedStation) {
                clickedStation.isPressed = true;
                this.addIngredientToPlate(clickedStation.typeKey);
                return;
            }

            // Check button clicks
            if (this.submitBtn.contains(x, y)) {
                this.submitBtn.isPressed = true;
                this.submitOrder();
                return;
            }

            if (this.trashBtn.contains(x, y)) {
                this.trashBtn.isPressed = true;
                this.clearPlate();
                return;
            }
        }

        addIngredientToPlate(typeKey) {
            if (!this.currentOrder) return;
            
            // Limit stack height to prevent overflow
            if (this.plateStack.length < 8) {
                this.plateStack.push(typeKey);
            }
        }

        clearPlate() {
            this.plateStack = [];
            this.createParticles(CONFIG.CANVAS_WIDTH/2, CONFIG.CANVAS_HEIGHT - 350, '#94a3b8'); // Grey poof
        }

        submitOrder() {
            if (!this.currentOrder || this.plateStack.length === 0) return;

            // Check if exact match (order and quantity)
            const isMatch = this.plateStack.length === this.currentOrder.ingredients.length &&
                            this.plateStack.every((val, index) => val === this.currentOrder.ingredients[index]);

            const plateX = CONFIG.CANVAS_WIDTH / 2;
            const plateY = CONFIG.CANVAS_HEIGHT - 350;

            if (isMatch) {
                // Correct Move!
                this.score += 10 + (this.currentOrder.ingredients.length * 5);
                this.plateStack = [];
                this.currentOrder = new Order(this.score);
                this.timeLeft = Math.min(CONFIG.GAME_DURATION, this.timeLeft + 2); // 2 sec time bonus
                this.createParticles(plateX, plateY, '#4ade80');
                this.addFloatingText('+Score!', plateX, plateY - 60, '#4ade80');
            } else {
                // Wrong Move! Penalty
                this.timeLeft -= 5;
                this.plateStack = [];
                this.createParticles(plateX, plateY, '#ef4444');
                this.addFloatingText('-5s Penalty', plateX, plateY - 60, '#ef4444');
                
                if (this.timeLeft <= 0) {
                    this.timeLeft = 0;
                    this.endGame();
                }
            }
        }

        addFloatingText(text, x, y, color) {
            this.floatingTexts.push({
                text: text,
                x: x,
                y: y,
                color: color,
                life: 1.0,
                vy: -2
            });
        }

        createParticles(x, y, color) {
            for(let i=0; i<10; i++) {
                this.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        update(dt) {
            if (this.state !== 'PLAYING') return;

            // Timer
            this.timeLeft -= dt;
            if (this.timeLeft <= 0) {
                this.timeLeft = 0;
                this.endGame();
            }

            // Update particles
            for (let i = this.particles.length - 1; i >= 0; i--) {
                let p = this.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt * 2; // fade speed
                if (p.life <= 0) this.particles.splice(i, 1);
            }

            // Update floating texts
            for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                let ft = this.floatingTexts[i];
                ft.y += ft.vy;
                ft.life -= dt * 1.5;
                if (ft.life <= 0) this.floatingTexts.splice(i, 1);
            }
        }

        draw() {
            // Clear Background
            this.ctx.fillStyle = CONFIG.COLORS.bg;
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            // Draw Countertop (bottom section)
            this.ctx.fillStyle = CONFIG.COLORS.counter;
            this.ctx.fillRect(0, CONFIG.CANVAS_HEIGHT - 250, CONFIG.CANVAS_WIDTH, 250);
            
            // Draw Counter line
            this.ctx.strokeStyle = '#cbbba0';
            this.ctx.lineWidth = 10;
            this.ctx.beginPath();
            this.ctx.moveTo(0, CONFIG.CANVAS_HEIGHT - 250);
            this.ctx.lineTo(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT - 250);
            this.ctx.stroke();

            if (this.state === 'PLAYING') {
                // HUD
                this.ctx.fillStyle = CONFIG.COLORS.text;
                this.ctx.font = 'bold 40px "Chewy", cursive';
                this.ctx.textAlign = 'left';
                this.ctx.fillText(`Score: ${this.score}`, 30, 60);
                
                this.ctx.textAlign = 'right';
                // Color timer red if low
                this.ctx.fillStyle = this.timeLeft <= 10 ? '#ef4444' : CONFIG.COLORS.text;
                this.ctx.fillText(`Time: ${Math.ceil(this.timeLeft)}s`, CONFIG.CANVAS_WIDTH - 30, 60);

                // Draw Order Ticket
                if (this.currentOrder) {
                    this.currentOrder.draw(this.ctx, this.plateStack);
                }

                // Draw Central Plate
                const plateX = CONFIG.CANVAS_WIDTH / 2;
                const plateY = CONFIG.CANVAS_HEIGHT - 350;
                
                // Plate visual
                this.ctx.fillStyle = '#fff';
                this.ctx.strokeStyle = '#e2e8f0';
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.ellipse(plateX, plateY + 30, 160, 40, 0, 0, Math.PI*2);
                this.ctx.fill();
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.ellipse(plateX, plateY + 30, 120, 30, 0, 0, Math.PI*2);
                this.ctx.stroke();

                // Draw Ingredients on Plate (Stacked bottom-up)
                for (let i = 0; i < this.plateStack.length; i++) {
                    const ingKey = this.plateStack[i];
                    // Stack upwards, slight vertical compression for perspective
                    const drawY = plateY - (i * 25);
                    GraphicsEngine.drawIngredient(this.ctx, ingKey, plateX, drawY, 140, 40);
                }

                // Draw UI Buttons
                this.submitBtn.draw(this.ctx);
                this.trashBtn.draw(this.ctx);

                // Draw Stations
                this.stations.forEach(station => station.draw(this.ctx));
                
                // Draw Particles
                this.particles.forEach(p => {
                    this.ctx.globalAlpha = Math.max(0, p.life);
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
                    this.ctx.fill();
                });

                // Draw Floating Texts
                this.ctx.textAlign = 'center';
                this.floatingTexts.forEach(ft => {
                    this.ctx.globalAlpha = Math.max(0, ft.life);
                    this.ctx.fillStyle = ft.color;
                    this.ctx.font = 'bold 36px "Chewy", cursive';
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 4;
                    this.ctx.strokeText(ft.text, ft.x, ft.y);
                    this.ctx.fillText(ft.text, ft.x, ft.y);
                });

                this.ctx.globalAlpha = 1.0;
            }
        }

        loop(timestamp) {
            const dt = (timestamp - this.lastTime) / 1000; // Delta time in seconds
            this.lastTime = timestamp;

            // Cap delta time to prevent large jumps if tab is inactive
            if (dt < 0.1) {
                this.update(dt);
            }
            this.draw();

            requestAnimationFrame((time) => this.loop(time));
        }
    }

    // ==========================================
    // --- MODULE: Initialization ---
    // ==========================================
    window.onload = () => {
        // Start the engine
        const game = new Game('gameCanvas');
    };

</script>
</body>
</html>
